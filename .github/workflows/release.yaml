name: Kubernetes

on:
  schedule:
    # Run at 2:00 UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual triggering
    inputs:
      page:
        description: The page number to fetch
        default: "1"
        type: string
      per_page:
        description: The number of releases per page
        default: "50"
        type: string
      force:
        description: Force the build even if the release already exists
        default: "false"
        type: string
      kubernetes_minor_version:
        description: The minimum minor version of Kubernetes to build
        type: string
      kubernetes_version:
        description: A single Kubernetes version to rebuild, e.g. v1.36.7, even when its release exists (e.g. after its Go dependency pins change); the other inputs are then ignored
        type: string
      dry_run:
        description: Go through the whole build, including the tests and the images, but publish nothing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # The versions to build, one release-version.yaml run each, so a long build
  # or test of one version cannot hold up or time out the others.
  versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Find the versions to build
        id: versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PAGE: ${{ inputs.page }}
          PER_PAGE: ${{ inputs.per_page }}
          FORCE: ${{ inputs.force }}
          MIN_MINOR: ${{ inputs.kubernetes_minor_version }}
          KUBERNETES_VERSION_INPUT: ${{ inputs.kubernetes_version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          matrix=$(./hack/pin-deps/ci.sh release-versions)
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          [ "$DRY_RUN" != true ] || echo "**Dry run: builds and tests, publishes nothing.**" >> "$GITHUB_STEP_SUMMARY"
          echo "### Kubernetes versions to build" >> "$GITHUB_STEP_SUMMARY"
          echo "${matrix}" | jq -r '.include[] | "- \(.version): \(if .source then "from source with Go dependency pins, tested" else "dl.k8s.io binaries" end)"' >> "$GITHUB_STEP_SUMMARY"

  # One run of release-version.yaml per version: build, the tests of a source
  # build in parallel, then publish. Its jobs narrow these permissions; only
  # publish, which a dry run skips, can write.
  release:
    needs: versions
    if: fromJson(needs.versions.outputs.matrix).include[0] != null
    name: Release ${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.versions.outputs.matrix) }}
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release-version.yaml
    with:
      version: ${{ matrix.version }}
      source: ${{ matrix.source }}
      dry_run: ${{ inputs.dry_run == true }}
