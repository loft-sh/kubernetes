name: Kubernetes

on:
  schedule:
    # Run at 2:00 UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual triggering
    inputs:
      page:
        description: The page number to fetch
        default: "1"
        type: string
      per_page:
        description: The number of releases per page
        default: "50"
        type: string
      force:
        description: Force the build even if the release already exists
        default: "false"
        type: string
      kubernetes_minor_version:
        description: The minimum minor version of Kubernetes to build
        type: string
      kubernetes_version:
        description: A single Kubernetes version to rebuild, e.g. v1.36.7, even when its release exists (e.g. after its Go dependency pins change); the other inputs are then ignored
        type: string
      dry_run:
        description: Go through the whole build, including the e2e tests and the images, but publish nothing
        type: boolean
        default: false

jobs:
  # The versions to build, one release job each, so a long build or test of one
  # version cannot hold up or time out the others.
  versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find the versions to build
        id: versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PAGE: ${{ inputs.page }}
          PER_PAGE: ${{ inputs.per_page }}
          FORCE: ${{ inputs.force }}
          MIN_MINOR: ${{ inputs.kubernetes_minor_version }}
          KUBERNETES_VERSION_INPUT: ${{ inputs.kubernetes_version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          matrix=$(./hack/pin-deps/ci.sh release-versions)
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          [ "$DRY_RUN" != true ] || echo "**Dry run: builds and tests, publishes nothing.**" >> "$GITHUB_STEP_SUMMARY"
          echo "### Kubernetes versions to build" >> "$GITHUB_STEP_SUMMARY"
          echo "${matrix}" | jq -r '.include[] | "- \(.version) on \(.runner)"' >> "$GITHUB_STEP_SUMMARY"

  # Downloads the binaries, or builds them from source with Go dependency pins
  # and e2e-tests them (on large-8_32), then publishes the release and images.
  release:
    needs: versions
    if: fromJson(needs.versions.outputs.matrix).include[0] != null
    name: Release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.versions.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Not in a dry run, so an image push could not go through by mistake.
      - name: Login to GitHub Container Registry
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, test and publish Kubernetes ${{ matrix.version }}
        env:
          # No token in a dry run, so a release upload could not go through by mistake.
          GH_TOKEN: ${{ !inputs.dry_run && secrets.GITHUB_TOKEN || '' }}
          REPO: ${{ github.repository }}
          VERSION: ${{ matrix.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          # Outside hack/, the context of the image builds.
          ARTIFACTS: ${{ runner.temp }}/e2e-artifacts
        run: ./hack/release-version.sh "$VERSION"

      - name: Upload e2e test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: release-e2e-${{ matrix.version }}
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: ignore
