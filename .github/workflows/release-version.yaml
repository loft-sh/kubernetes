name: Release Kubernetes version

# One Kubernetes patch release, called by release.yaml once per version, so a
# version that fails cannot hold up the others:
#   build:   download.sh gets the binaries (built from source when a Go
#            dependency pin raises a dependency), and the images are built
#            without pushing them, so a broken build stops here.
#   unit, integration, e2e: only for a source build, in parallel; they build
#            their own binaries from the same source, pins and toolchain.
#   publish: uploads the archives to the GitHub release and pushes the images,
#            once the build and every test passed. A dry run skips it, so a
#            dry run never gets a token that can write.

on:
  workflow_call:
    inputs:
      version:
        description: Kubernetes patch release, e.g. v1.36.7
        required: true
        type: string
      source:
        description: Built from source with Go dependency pins, and tested
        required: true
        type: boolean
      dry_run:
        description: Build and test, but publish nothing
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  K8S_DIR: k8s-src

jobs:
  build:
    name: Build
    # The source build compiles Kubernetes for two architectures.
    runs-on: ${{ inputs.source && 'large-8_32' || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get the binaries
        env:
          VERSION: ${{ inputs.version }}
        run: ./hack/release-version.sh build "$VERSION" "${RUNNER_TEMP}/release-files.tar"

      # As one tar: an artifact does not keep the binaries' executable bit.
      - name: Upload the build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: release-files-${{ inputs.version }}
          path: ${{ runner.temp }}/release-files.tar
          retention-days: 7
          if-no-files-found: error

      - name: Build the images
        env:
          VERSION: ${{ inputs.version }}
        run: ./hack/release-version.sh images "$VERSION"

  unit:
    name: Unit tests
    if: inputs.source
    runs-on: large-8_32
    timeout-minutes: 240
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Kubernetes ${{ inputs.version }} with its pins
        uses: ./.github/actions/k8s-pinned-source
        with:
          version: ${{ inputs.version }}
          dir: ${{ env.K8S_DIR }}

      - name: Unit tests
        run: ./hack/pin-deps/ci.sh unit "$K8S_DIR"

  integration:
    name: Integration tests
    if: inputs.source
    runs-on: large-8_32
    timeout-minutes: 240
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Kubernetes ${{ inputs.version }} with its pins
        uses: ./.github/actions/k8s-pinned-source
        with:
          version: ${{ inputs.version }}
          dir: ${{ env.K8S_DIR }}

      - name: Integration tests
        run: ./hack/pin-deps/ci.sh integration "$K8S_DIR"

  e2e:
    name: E2E tests
    if: inputs.source
    runs-on: large-8_32
    timeout-minutes: 300
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Kubernetes ${{ inputs.version }} with its pins
        uses: ./.github/actions/k8s-pinned-source
        with:
          version: ${{ inputs.version }}
          dir: ${{ env.K8S_DIR }}

      - name: E2E tests on kind
        env:
          ARTIFACTS: ${{ github.workspace }}/artifacts
        run: ./hack/pin-deps/ci.sh e2e "$K8S_DIR"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: release-e2e-${{ inputs.version }}
          path: artifacts
          if-no-files-found: ignore

  publish:
    name: Publish
    needs: [build, unit, integration, e2e]
    # The tests are skipped, not passed, for a version from dl.k8s.io.
    if: >-
      !cancelled() && !inputs.dry_run && needs.build.result == 'success' &&
      (!inputs.source || (needs.unit.result == 'success' && needs.integration.result == 'success' && needs.e2e.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write  # the GitHub release
      packages: write  # the images
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: release-files-${{ inputs.version }}
          path: ${{ runner.temp }}

      - name: Publish Kubernetes ${{ inputs.version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: ./hack/release-version.sh publish "$VERSION" "${RUNNER_TEMP}/release-files.tar"
